<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סטטוס מערכת — MasterKodi IL</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
  .rows { display: grid; gap: 14px; }
  .rowcard { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .rowcard .name { font-weight: 700; min-width: 180px; }
  .rowcard .val { color: var(--muted); font-size: .95rem; }
  .runline { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .runline:last-child { border-bottom: 0; }
  .runline .nm { font-weight: 600; min-width: 170px; }
  .runline .tm { color: var(--muted); margin-inline-start: auto; font-size: .85rem; }
  .ok { color: var(--good); } .run { color: var(--warn); } .fail { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">

  <div class="site-head">
    <div class="logo">MK</div>
    <div>
      <div class="t1">MasterKodi IL</div>
      <div class="t2">סטטוס מערכת</div>
    </div>
    <div class="spacer"></div>
    <a class="badge" href="../">עמוד ראשי</a>
    <a class="badge kofi" href="https://ko-fi.com/A6U326F2LR" target="_blank" rel="noopener" title="תמיכה בפרויקט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4Z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg> תמיכה</a>
    <a class="badge" href="../download/">הורדה</a>
  </div>

  <h1 class="page">סטטוס מערכת</h1>
  <p class="lead">מצב חי של הבילד: גירסאות נוכחיות, טריות ההתקנות, ובניות שרצות כרגע.</p>

  <div class="rows">
    <div class="card rowcard">
      <span class="name">גירסת אשף (Wizard)</span>
      <b class="mono" id="wiz-ver">…</b>
      <span class="val" id="fleet-updated"></span>
    </div>
    <div class="card rowcard">
      <span class="name">גירסת קונפיג</span>
      <b class="mono" id="cfg-ver">…</b>
      <span class="val">מספר תוספים בבילד: <b class="mono" id="addon-count">…</b></span>
    </div>
    <div class="card rowcard">
      <span class="name">התקנות (EXE / APK)</span>
      <span class="val" id="installers-line">…</span>
    </div>
    <div class="card" style="width:100%">
      <div style="font-weight:700; margin-bottom:8px">ריצות אחרונות של מערכת הבנייה</div>
      <div id="runs">טוען…</div>
    </div>
  </div>

  <div class="footer">מתעדכן אוטומטית כל דקה
    &nbsp;·&nbsp; <a href="https://asafnuvio.asaf27064.workers.dev/" target="_blank" rel="noopener">נוביו</a> &nbsp;·&nbsp; <a href="https://ko-fi.com/A6U326F2LR" target="_blank" rel="noopener">תמיכה</a></div>
</div>

<script>
(function () {
  var REPO = 'asaf27064/MasterKodi-IL-Build';
  function relTime(iso) {
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 3600) return 'לפני ' + Math.max(1, Math.round(diff / 60)) + ' דקות';
    if (diff < 86400) return 'לפני ' + Math.round(diff / 3600) + ' שעות';
    return 'לפני ' + Math.round(diff / 86400) + ' ימים';
  }
  function get(u) { return fetch(u, {cache: 'no-store'}).then(function (r) { if (!r.ok) throw 0; return r.json(); }); }

  function refresh() {
    get('https://raw.githubusercontent.com/' + REPO + '/main/manifest.json?ts=' + Date.now()).then(function (m) {
      var wiz = (m.addons || []).filter(function (a) { return a.id === 'plugin.program.masterkodi.il.wizard'; })[0];
      if (wiz) document.getElementById('wiz-ver').textContent = wiz.version;
      if (m.config) document.getElementById('cfg-ver').textContent = m.config.version;
      document.getElementById('addon-count').textContent = (m.addons || []).length;
      if (m.generated_utc) document.getElementById('fleet-updated').textContent = 'עודכן ' + relTime(m.generated_utc);
    }).catch(function () {});

    get('https://api.github.com/repos/' + REPO + '/releases/tags/installers').then(function (rel) {
      var parts = (rel.assets || []).map(function (a) {
        var short = a.name.indexOf('.exe') !== -1 ? 'EXE' : (a.name.indexOf('arm64') !== -1 ? 'APK 64' : 'APK 32');
        return short + ' נבנה ' + relTime(a.updated_at);
      });
      document.getElementById('installers-line').textContent = parts.join(' · ');
    }).catch(function () {});

    get('https://api.github.com/repos/' + REPO + '/actions/runs?per_page=10').then(function (r) {
      var html = '';
      (r.workflow_runs || []).slice(0, 8).forEach(function (w) {
        var cls = 'run', txt = 'רץ כעת';
        if (w.status === 'completed') {
          cls = w.conclusion === 'success' ? 'ok' : 'fail';
          txt = w.conclusion === 'success' ? 'הצליח' : 'נכשל';
        }
        html += '<div class="runline"><span class="nm mono">' + w.name + '</span>' +
                '<span class="' + cls + '">' + txt + '</span>' +
                '<span class="tm">' + relTime(w.created_at) + '</span></div>';
      });
      document.getElementById('runs').innerHTML = html || 'אין ריצות';
    }).catch(function () {
      document.getElementById('runs').textContent = 'לא ניתן לטעון (מגבלת קצב) — נסו שוב בעוד דקה';
    });
  }
  refresh();
  setInterval(refresh, 60000);
})();
</script>
</body>
</html>
